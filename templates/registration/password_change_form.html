{% extends "base.html" %}
{% block titulo %}Alterar senha{% endblock %}
{% block conteudo %}
<h1>Alterar senha</h1>
<form method="post" class="formulario formulario-estreito">
  {% csrf_token %}
  {% for field in form %}
    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
    {{ field }}
    {% for erro in field.errors %}<p class="erro-campo">{{ erro }}</p>{% endfor %}
  {% endfor %}
  <button type="submit" class="botao">Salvar nova senha</button>
</form>
{% endblock %}

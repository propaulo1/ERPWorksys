# Coloque o certificado em deploy/certs/erp.crt e deploy/certs/erp.key.
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/erp.crt;
    ssl_certificate_key /etc/nginx/certs/erp.key;

    client_max_body_size 25m;   # anexos e fotos do diário de obra

    location /media/ {
        alias /srv/media/;
    }

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
